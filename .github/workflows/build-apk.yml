name: Build Android APK

# Builds a signed release APK on every push to main and publishes it to the
# "latest" GitHub Release, so the app can be installed/updated straight from the
# repo's Releases page.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Strip any CR/whitespace (Windows-set secrets can carry a trailing \r).
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/upload-keystore.jks
          ls -l android/app/upload-keystore.jks
          KS_PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          KA=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')
          KP=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KS_PW
          keyAlias=$KA
          keyPassword=$KP
          EOF

      - run: flutter pub get

      - run: flutter build apk --release

      # Pull the version straight from pubspec so the release title and notes
      # always match the build. "version: 1.27.0+32" -> name 1.27.0, code 32.
      - name: Read app version
        id: ver
        run: |
          LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NAME="${LINE%%+*}"
          CODE="${LINE##*+}"
          # Dessert codename for the release, à la Android. Bump
          # app_codename.txt each release.
          CODENAME=$(cat app_codename.txt 2>/dev/null | tr -d '\r\n' || echo "")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "codename=$CODENAME" >> "$GITHUB_OUTPUT"
          echo "Building release $NAME ($CODE) — $CODENAME"

      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Chatori Kitchen ${{ steps.ver.outputs.name }} — ${{ steps.ver.outputs.codename }}"
          # Overwrite the notes each build so the page never shows a stale
          # version. Keep it generic — the commit history is the changelog.
          body: |
            **Chatori Kitchen ${{ steps.ver.outputs.name }} “${{ steps.ver.outputs.codename }}”** (build ${{ steps.ver.outputs.code }})

            Latest build from `main`, generated ${{ github.sha }}.
            Download **app-release.apk** below and install it over your current version.
          files: build/app/outputs/flutter-apk/app-release.apk
